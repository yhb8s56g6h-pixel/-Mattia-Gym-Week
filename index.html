<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mattia Gym Week</title>
<style>
:root{--bg:#0B0F14;--card:#141B24;--card2:#0F151D;--text:#F5F7FA;--muted:#8E9AA8;--line:#283441;--accent:#8BFF5E;--accent2:#5FE0FF;--danger:#FF7777}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#081018,#0B0F14 32%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:820px;margin:auto;padding:18px 14px 110px}.head{position:sticky;top:0;z-index:10;padding:7px 0 16px;background:linear-gradient(180deg,rgba(11,15,20,.98),rgba(11,15,20,.92),rgba(11,15,20,0));backdrop-filter:blur(14px)}
.brand{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:5px}.pill{background:var(--accent);color:#071108;padding:7px 10px;border-radius:999px;font-weight:900;font-size:11px}
.hero{background:linear-gradient(135deg,#17212C,#111821);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.28)}.row{display:flex;justify-content:space-between;gap:10px}.hero h2{margin:2px 0 0;font-size:19px}.pct{font-size:34px;font-weight:900}.muted{color:var(--muted);font-size:11px}.bar{height:9px;background:#222D39;border-radius:999px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#0D131A;border:1px solid #202B36;border-radius:14px;padding:10px}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:var(--muted)}
.days{display:flex;gap:8px;overflow:auto;padding:15px 0 4px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.day{min-width:92px;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:15px;padding:10px}.day.active{outline:2px solid var(--accent);background:#142019}.day.done{border-color:#37613B}.day small{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.title{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.title h3{margin:0;font-size:18px}.title span{color:var(--muted);font-size:11px}
.notice{background:#111A23;border-left:3px solid var(--accent2);padding:10px 12px;border-radius:10px;color:#CAD5DF;font-size:12px;margin-bottom:10px}
.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.exercise.doneCard{border-color:#315D35}.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.exh h4{margin:0;font-size:16px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.badge{font-size:10px;color:var(--accent);background:#14221A;border:1px solid #2C4F32;padding:5px 7px;border-radius:999px;white-space:nowrap}
.labels,.set{display:grid;grid-template-columns:34px 1fr 1fr 1fr 38px;gap:6px;align-items:center}.labels{font-size:9px;color:var(--muted);padding:11px 1px 4px}.set{margin-top:7px}.n{height:30px;border-radius:9px;background:#0C1218;border:1px solid #23303B;display:grid;place-items:center;color:var(--muted);font-weight:800}
input{width:100%;min-width:0;background:#0C1218;border:1px solid #293744;border-radius:10px;color:var(--text);padding:9px 7px;font-size:13px;outline:none}input:focus{border-color:var(--accent)}
.chk{appearance:none;width:34px;height:34px;padding:0;border-radius:10px}.chk:checked{background:var(--accent);border-color:var(--accent)}.chk:checked:after{content:"✓";display:grid;place-items:center;height:100%;color:#071108;font-weight:900}
.tip{font-size:11px;color:#C4D0DB;background:#0F161E;border-radius:10px;padding:9px 10px;margin-top:10px}
textarea{width:100%;min-height:78px;resize:vertical;background:#0C1218;border:1px solid #293744;color:var(--text);border-radius:12px;padding:10px;font:inherit}
.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(8,12,17,.94);backdrop-filter:blur(16px);border-top:1px solid #202A35;padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:20}.footin{max-width:820px;margin:auto;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:12px 8px;font-weight:900}.sec{background:#19232D;color:var(--text);border:1px solid #2D3946}.pri{background:var(--accent);color:#071108}.bad{background:#27191B;color:#FFA0A0;border:1px solid #4B292E}
.timer{position:fixed;right:14px;bottom:86px;z-index:19;background:#151E27;border:1px solid #344453;border-radius:17px;padding:11px 14px;box-shadow:0 14px 35px rgba(0,0,0,.32);display:none}.timer strong{font-size:25px}.timer small{display:block;color:var(--muted);font-size:10px}
</style>
</head>
<body>
<div class="app">
<div class="head"><div class="brand"><div><h1>Mattia Gym Week</h1><div class="sub">Settimana 1 · Riattivazione · Massa / Forza / Ipertrofia</div></div><div class="pill">WEEK 1</div></div></div>
<div class="hero">
<div class="row"><div><div class="muted">PROGRESSO SETTIMANA</div><h2>4 allenamenti + 1 facoltativo</h2></div><div style="text-align:right"><div class="pct" id="pct">0%</div><div class="muted">completato</div></div></div>
<div class="bar"><i id="bar"></i></div>
<div class="stats">
<div class="stat"><b id="workouts">0/4</b><span>allenamenti base</span></div>
<div class="stat"><b id="sets">0</b><span>serie completate</span></div>
<div class="stat"><b id="volume">0 kg</b><span>volume registrato</span></div>
</div></div>
<div class="days" id="days"></div>
<div id="content"></div>
<div class="title"><h3>Note seduta</h3><span>salvataggio automatico</span></div>
<textarea id="notes" placeholder="Energia, dolori, sensazioni, tecnica..."></textarea>
</div>
<div class="timer" id="timer"><small>RECUPERO</small><strong id="timerText">01:30</strong><small>Tocca per annullare</small></div>
<div class="footer"><div class="footin">
<button class="btn sec" onclick="startTimer(90)">⏱ 90s</button>
<button class="btn pri" onclick="finishWorkout()">✓ Termina</button>
<button class="btn bad" onclick="resetDay()">Reset</button>
</div></div>
<script>
const plan=[
{id:"sun",label:"Dom 20",title:"Circuito Upper",required:true,doneInitially:true,subtitle:"Già completato",ex:[
["Chest Press","2 × 12",90,"15 kg · 6/10",[[15,12,6],[15,12,6]]],
["Lat Machine","2 × 12",90,"15 kg → 20 kg",[[15,12,5],[20,12,6.5]]],
["Curl manubri","2 × 12",75,"4 kg per mano",[[4,12,5],[4,12,5.5]]],
["Pushdown cavo","2 × 12",75,"10 kg · 7.5/10",[[10,12,7.5],[10,12,7.5]]],
["Shoulder Press","2 × 12",90,"10 kg · 7.5/10",[[10,12,7.5],[10,12,7.5]]],
["Crunch","2 × 15",60,"Corpo libero · 4/10",[[0,15,4],[0,15,4]]]
]},
{id:"mon",label:"Lun 21",title:"Lower + Core",required:true,subtitle:"55–70 min · RIR ~3",ex:[
["Leg Press","3 × 10",120,"Parti da 40 kg. ≤5/10: prova 50. ≥8/10: scendi a 30–35.",[[40,10,""],[40,10,""],[40,10,""]]],
["Leg Curl","2 × 12",90,"15 kg iniziali; 20 se molto facile.",[[15,12,""],[15,12,""]]],
["Leg Extension","2 × 12",90,"15 kg iniziali; 20 se ≤5/10.",[[15,12,""],[15,12,""]]],
["Calf Raise","2 × 15",75,"~20 kg alla macchina oppure corpo libero 2×20.",[[20,15,""],[20,15,""]]],
["Crunch","3 × 15–20",60,"Corpo libero.",[[0,15,""],[0,15,""],[0,15,""]]],
["Plank","2 × 25–30 sec",60,"Inserisci i secondi nel campo reps.",[[0,30,""],[0,30,""]]]
]},
{id:"wed",label:"Mer 23",title:"Upper Body",required:true,subtitle:"60–75 min · tecnica pulita",ex:[
["Chest Press","3 × 10",120,"20 kg. Se la 1ª serie è ≥8/10, torna a 15.",[[20,10,""],[20,10,""],[20,10,""]]],
["Lat Machine","3 × 10",120,"20 kg. Se resti ≤6/10, la volta dopo puoi provare 25.",[[20,10,""],[20,10,""],[20,10,""]]],
["Seated Row / Pulley","2 × 12",90,"15 kg iniziali; 20 se troppo facile.",[[15,12,""],[15,12,""]]],
["Shoulder Press","2 × 10",90,"10 kg.",[[10,10,""],[10,10,""]]],
["Alzate laterali","2 × 12–15",75,"3 kg per mano.",[[3,12,""],[3,12,""]]],
["Curl manubri","2 × 10–12",75,"5 kg; torna a 4 se ≥8/10.",[[5,10,""],[5,10,""]]],
["Pushdown cavo","2 × 10–12",75,"10 kg.",[[10,10,""],[10,10,""]]],
["Crunch","2 × 15–20",60,"Corpo libero.",[[0,15,""],[0,15,""]]]
]},
{id:"fri",label:"Ven 25",title:"Full Body",required:true,subtitle:"60–80 min · consolidamento",ex:[
["Leg Press","2 × 10",120,"Usa il carico risultato corretto lunedì.",[[40,10,""],[40,10,""]]],
["Leg Curl","2 × 10–12",90,"15–20 kg in base a lunedì.",[[15,10,""],[15,10,""]]],
["Chest Press","2 × 10",120,"20 kg se mercoledì è stato corretto.",[[20,10,""],[20,10,""]]],
["Lat Machine","2 × 10",120,"20 kg; 25 solo se mercoledì eri ≤6/10.",[[20,10,""],[20,10,""]]],
["Seated Row","2 × 10–12",90,"15–20 kg.",[[15,10,""],[15,10,""]]],
["Shoulder Press","2 × 10",90,"10 kg.",[[10,10,""],[10,10,""]]],
["Curl manubri","2 × 10",75,"5 kg per mano.",[[5,10,""],[5,10,""]]],
["Pushdown","2 × 10",75,"10 kg.",[[10,10,""],[10,10,""]]],
["Crunch","2 × 15–20",60,"Corpo libero.",[[0,15,""],[0,15,""]]]
]},
{id:"sat",label:"Sab 26",title:"Pump + Tecnica",required:false,subtitle:"FACOLTATIVO · circa 6/10",ex:[
["Chest Press","2 × 12",75,"15 kg.",[[15,12,""],[15,12,""]]],
["Lat Machine","2 × 12",75,"15–20 kg.",[[15,12,""],[15,12,""]]],
["Alzate laterali","2 × 15",60,"3 kg per mano.",[[3,15,""],[3,15,""]]],
["Curl","2 × 12",60,"4 kg per mano.",[[4,12,""],[4,12,""]]],
["Pushdown","2 × 12",60,"7.5–10 kg.",[[10,12,""],[10,12,""]]],
["Leg Extension","2 × 15",75,"Leggero, tecnica pulita.",[[15,15,""],[15,15,""]]],
["Crunch","3 × 15",60,"Corpo libero.",[[0,15,""],[0,15,""],[0,15,""]]]
]}];

const KEY="mattiaGymWeek_v1"; let state=JSON.parse(localStorage.getItem(KEY)||"{}"); let active=state.active||"mon"; let t=null,left=0;
function init(){plan.forEach(d=>{if(!state[d.id])state[d.id]={finished:!!d.doneInitially,notes:"",ex:{}};d.ex.forEach((e,i)=>{if(!state[d.id].ex[i])state[d.id].ex[i]=e[4].map(s=>({kg:s[0],reps:s[1],effort:s[2],done:!!d.doneInitially}))})});save()}
function save(){state.active=active;localStorage.setItem(KEY,JSON.stringify(state))}
function renderDays(){let el=document.getElementById("days");el.innerHTML="";plan.forEach(d=>{let b=document.createElement("button");b.className="day "+(d.id===active?"active ":"")+(state[d.id].finished?"done":"");b.innerHTML=`<b>${d.label}</b><small>${d.title}${d.required?"":" · opz."}</small>`;b.onclick=()=>{active=d.id;save();render()};el.appendChild(b)})}
function renderContent(){let d=plan.find(x=>x.id===active),s=state[active],c=document.getElementById("content");c.innerHTML=`<div class="title"><h3>${d.title}</h3><span>${d.subtitle}</span></div><div class="notice"><b>Regola carico:</b> punta a circa 6–7.5/10 e ~3 ripetizioni in riserva. Questa settimana niente cedimento.</div>`;d.ex.forEach((e,ei)=>{let card=document.createElement("div");card.className="exercise "+(s.finished?"doneCard":"");let rows="";s.ex[ei].forEach((x,si)=>{rows+=`<div class="set"><div class="n">${si+1}</div><input type="number" inputmode="decimal" value="${x.kg}" onchange="upd(${ei},${si},'kg',this.value)"><input type="number" inputmode="numeric" value="${x.reps}" onchange="upd(${ei},${si},'reps',this.value)"><input type="number" inputmode="decimal" step=".5" min="1" max="10" placeholder="/10" value="${x.effort}" onchange="upd(${ei},${si},'effort',this.value)"><input class="chk" type="checkbox" ${x.done?"checked":""} onchange="toggleSet(${ei},${si},this.checked,${e[2]})"></div>`});card.innerHTML=`<div class="exh"><div><h4>${e[0]}</h4><div class="meta">${e[1]} · recupero ${e[2]}s</div></div><div class="badge">${e[1]}</div></div><div class="labels"><span></span><span>kg</span><span>reps</span><span>fatica</span><span>✓</span></div>${rows}<div class="tip">${e[3]}</div>`;c.appendChild(card)});let n=document.getElementById("notes");n.value=s.notes||"";n.oninput=()=>{state[active].notes=n.value;save()}}
function upd(ei,si,k,v){state[active].ex[ei][si][k]=v===""?"":Number(v);save();stats()}
function toggleSet(ei,si,ch,rest){state[active].ex[ei][si].done=ch;save();stats();if(ch)startTimer(rest)}
function finishWorkout(){state[active].finished=true;Object.values(state[active].ex).forEach(a=>a.forEach(x=>x.done=true));save();render()}
function resetDay(){if(!confirm("Azzerare questa giornata?"))return;delete state[active];save();init();render()}
function startTimer(sec){clearInterval(t);left=sec;let box=document.getElementById("timer");box.style.display="block";function tick(){let m=Math.floor(left/60),s=left%60;document.getElementById("timerText").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;if(left<=0){clearInterval(t);navigator.vibrate?.([120,80,120]);setTimeout(()=>box.style.display="none",1200);return}left--}tick();t=setInterval(tick,1000);box.onclick=()=>{clearInterval(t);box.style.display="none"}}
function stats(){let req=plan.filter(d=>d.required),done=req.filter(d=>state[d.id].finished).length,sets=0,vol=0;plan.forEach(d=>Object.values(state[d.id].ex).forEach(a=>a.forEach(x=>{if(x.done){sets++;vol+=(Number(x.kg)||0)*(Number(x.reps)||0)}})));let p=Math.round(done/req.length*100);document.getElementById("pct").textContent=p+"%";document.getElementById("bar").style.width=p+"%";document.getElementById("workouts").textContent=`${done}/${req.length}`;document.getElementById("sets").textContent=sets;document.getElementById("volume").textContent=Math.round(vol).toLocaleString("it-IT")+" kg"}
function render(){renderDays();renderContent();stats()} init();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
